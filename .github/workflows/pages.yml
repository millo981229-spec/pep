name: Deploy web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install preview build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the preview from current source
        run: node scripts/build-web-preview.mjs
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp .next/preview/곳곳-웹-미리보기.html _site/index.html
          cp .nojekyll _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
